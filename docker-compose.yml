version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eve_healthcare_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql://eve_user:eve_password@db:5432/eve_healthcare_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=super-secret-eve-healthcare-jwt-key-change-in-production-2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - eve_network

  db:
    image: postgres:16-alpine
    container_name: eve_healthcare_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=eve_user
      - POSTGRES_PASSWORD=eve_password
      - POSTGRES_DB=eve_healthcare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve_user -d eve_healthcare_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eve_network

  redis:
    image: redis:7-alpine
    container_name: eve_healthcare_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eve_network

volumes:
  postgres_data:
  redis_data:

networks:
  eve_network:
    driver: bridge
